name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: gochin_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      GOCHIN_DB_HOST: localhost
      GOCHIN_DB_PORT: 5432
      GOCHIN_DB_USER: postgres
      GOCHIN_DB_PASSWORD: postgres
      GOCHIN_DB_NAME: gochin_test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test (race)
        run: go test -race -count=1 ./pkg/...

      # pkg/ must never import app/: that boundary is what keeps the
      # framework reusable across every generated project.
      - name: Layering check (pkg must not import app)
        run: |
          if go list -deps ./pkg/... | grep -q 'sachinkaru123/gochin/app'; then
            echo "pkg/ imports app/ — this must never happen in the framework repo"
            exit 1
          fi

      - name: Verify gochin new produces a working project
        run: |
          go build -o /tmp/gochin ./cmd/gochin
          cd /tmp
          GOCHIN_FRAMEWORK_REPLACE="$GITHUB_WORKSPACE" /tmp/gochin new smoketest
          cd smoketest
          go build ./...
          go run . db migrate
          go run . db seed
